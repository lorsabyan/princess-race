<!doctype html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Արքայադստեր մրցարշավը 👑</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="hidden">
    <div id="hearts"></div>
    <div id="coin-counter"><span id="coin-icon"></span><span id="coin-count">0</span></div>
  </div>

  <div id="start-screen" class="overlay">
    <div class="panel">
      <div class="crown">👑</div>
      <h1>Արքայադստեր<br />մրցարշավը</h1>
      <p class="subtitle">Հավաքի՛ր ոսկե մետաղադրամները,<br />շրջանցի՛ր խոչընդոտները</p>
      <button id="start-btn" class="big-btn">Սկսել 🚗</button>
      <p class="hint">← → ստեղներով կամ հպելով էկրանին</p>
    </div>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <div class="panel">
      <div class="crown">🌟</div>
      <h1>Ապրե՛ս</h1>
      <p class="result">Հավաքեցիր <span id="final-coins">0</span> մետաղադրամ</p>
      <p class="result best">Ռեկորդ՝ <span id="best-coins">0</span></p>
      <button id="restart-btn" class="big-btn">Նորից խաղալ ✨</button>
    </div>
  </div>

  <div id="touch-controls" class="hidden">
    <button id="btn-left" class="touch-btn" aria-label="Ձախ">◀</button>
    <button id="btn-right" class="touch-btn" aria-label="Աջ">▶</button>
  </div>

  <button id="mute-btn" aria-label="Ձայն">🔊</button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
