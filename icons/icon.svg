<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="0.55" stop-color="#ffa8d1"/>
      <stop offset="1" stop-color="#ffe3ee"/>
