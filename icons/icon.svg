  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- rainbow -->
  <path d="M 96 300 A 160 160 0 0 1 416 300" fill="none" stroke="#ff6b8a" stroke-width="14"/>
  <path d="M 112 300 A 144 144 0 0 1 400 300" fill="none" stroke="#ffe066" stroke-width="14"/>
  <path d="M 128 300 A 128 128 0 0 1 384 300" fill="none" stroke="#7fe08f" stroke-width="14"/>
  <path d="M 144 300 A 112 112 0 0 1 368 300" fill="none" stroke="#6fc3ff" stroke-width="14"/>
  <!-- road -->
  <rect x="76" y="300" width="360" height="140" rx="26" fill="#7e6ba8"/>
  <rect x="246" y="322" width="20" height="40" rx="8" fill="#fff4d6"/>
  <rect x="246" y="386" width="20" height="40" rx="8" fill="#fff4d6"/>
  <!-- car body -->
  <rect x="130" y="330" width="180" height="80" rx="36" fill="#ff5c9e"/>
  <rect x="150" y="296" width="110" height="70" rx="32" fill="#ff7cb2"/>
  <!-- wheels -->
  <circle cx="180" cy="416" r="34" fill="#3d2f4f"/>
  <circle cx="180" cy="416" r="16" fill="#fff4d6"/>
  <circle cx="272" cy="416" r="34" fill="#3d2f4f"/>
  <circle cx="272" cy="416" r="16" fill="#fff4d6"/>
  <!-- crown -->
  <path d="M 330 250 L 348 190 L 372 232 L 396 178 L 420 232 L 444 190 L 462 250 Z" fill="#ffc93c" stroke="#e0a614" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="396" cy="262" r="16" fill="#ff5c9e"/>
  <!-- heart on car -->
